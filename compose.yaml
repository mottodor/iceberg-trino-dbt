name: iceberg-trino-dbt

services:
  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    networks:
      - lakehouse
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail http://127.0.0.1:9000/health &&
          curl --fail http://127.0.0.1:9001/rustfs/console/health
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    cpus: 0.50
    mem_limit: 1g

  bucket-setup:
    image: amazon/aws-cli:2.36.44@sha256:e8467f2c319f9bc9a1471808a69949a76915e9c95eaf4a09ece9f9e85fd32747
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-west-2
      AWS_ENDPOINT_URL: http://rustfs:9000
      RUSTFS_BUCKET: iceberg-trino-dbt
    entrypoint: ["/bin/sh", "/bootstrap/create-bucket.sh"]
    volumes:
      - ./infra/rustfs:/bootstrap:ro
    networks:
      - lakehouse
    cpus: 0.25
    mem_limit: 256m

  polaris:
    image: apache/polaris:1.8.0@sha256:347615e736cab2c9be0d8c464552ac930be4755302bb0aeb745216bbae99ba5b
    restart: unless-stopped
    depends_on:
      bucket-setup:
        condition: service_completed_successfully
    environment:
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
      POLARIS_BOOTSTRAP_CREDENTIALS: >-
        POLARIS,${POLARIS_CLIENT_ID:?set POLARIS_CLIENT_ID},${POLARIS_CLIENT_SECRET:?set POLARIS_CLIENT_SECRET}
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
    ports:
      - "${POLARIS_API_PORT:-8181}:8181"
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 2s
      timeout: 10s
      retries: 20
      start_period: 10s
    cpus: 1.00
    mem_limit: 2g

  polaris-setup:
    image: alpine/curl:8.22.0@sha256:f05779b04a6f3c6f228c67118786f5c80d4c4922dd79b0b24c92dc10a74f594f
    restart: "no"
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:?set POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:?set POLARIS_CLIENT_SECRET}
      POLARIS_CATALOG: lakehouse
      RUSTFS_BUCKET: iceberg-trino-dbt
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    volumes:
      - ./infra/polaris:/bootstrap:ro
    networks:
      - lakehouse
    cpus: 0.25
    mem_limit: 256m

  trino:
    image: trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    restart: unless-stopped
    depends_on:
      polaris-setup:
        condition: service_completed_successfully
    environment:
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:?set POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:?set POLARIS_CLIENT_SECRET}
    ports:
      - "${TRINO_PORT:-8080}:8080"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    cpus: 2.00
    mem_limit: 4g

  dbt:
    profiles: ["tools"]
    image: iceberg-trino-dbt-dbt:1.0.0
    build:
      context: ./docker/dbt
    depends_on:
      trino:
        condition: service_healthy
    environment:
      DBT_TRINO_USER: ${DBT_TRINO_USER:-dbt}
      DBT_TRINO_HOST: trino
      DBT_TRINO_PORT: "8080"
      DBT_TRINO_CATALOG: ${DBT_TRINO_CATALOG:-lakehouse}
      DBT_TRINO_SCHEMA: ${DBT_TRINO_SCHEMA:-default}
    volumes:
      - ./dbt:/usr/app/dbt
    networks:
      - lakehouse
    cpus: 0.50
    mem_limit: 1g

networks:
  lakehouse:

volumes:
  rustfs-data:
