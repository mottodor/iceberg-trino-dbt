version: 2

models:
  - name: gold_hub_visits
    description: Strictly paired package hub visits with one row per arrival and nullable departure for an open visit.
    columns:
      - name: arrival_event_id
        data_tests: [not_null, unique]
      - name: package_id
        data_tests: [not_null]
      - name: hub_code
        data_tests: [not_null]
      - name: visit_seq
        data_tests: [not_null]
      - name: arrived_at
        data_tests: [not_null]
      - name: is_open
        data_tests: [not_null]

  - name: gold_package_delivery_fact
    description: Accumulating package delivery snapshot with SLA, route-distance, and completed-dwell metrics.
    columns:
      - name: package_id
        data_tests: [not_null, unique]
      - name: shipment_id
        data_tests: [not_null]
      - name: route_version_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_route_plan_versions')
                field: route_version_id
      - name: current_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - picked_up
                  - arrived_at_hub
                  - departed_at_hub
                  - out_for_delivery
                  - delivered
      - name: picked_up_at
        data_tests: [not_null]
      - name: promised_delivery_at
        data_tests: [not_null]
      - name: planned_distance_meters
        data_tests: [not_null]
      - name: actual_distance_meters
        data_tests: [not_null]
      - name: visit_count
        data_tests: [not_null]
      - name: completed_visit_count
        data_tests: [not_null]
      - name: open_visit_count
        data_tests: [not_null]
      - name: completed_dwell_hours
        data_tests: [not_null]
